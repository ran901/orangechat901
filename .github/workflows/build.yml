name: Build Debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      # 👇 这里是生成签名文件
      - name: Generate debug keystore
        run: keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 👇 编译 lock 版本
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleLock --no-daemon

      # 👇 上传 lock 版本的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lock-apk
          path: app/build/outputs/apk/lock/*.apk
